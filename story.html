<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>今日の予約状況（Instagramストーリー用 1080×1920）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     今日の予約状況ストーリー画像（1080×1920）
     Instagramの画面は、上端約250pxと下端約280pxに、アカウント名・返信欄が重なる。
     大事な内容は、その間（y=250〜1640）に収める。
     配色（theme）は、下の .theme-◯◯ の変数で切り替える。
     ============================================================ */
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{width:1080px; height:1920px; overflow:hidden; background:#000}
  body{font-family:"Zen Maru Gothic","Noto Sans CJK JP","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; -webkit-font-smoothing:antialiased}
  .en{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif}

  /* ---- 配色 ---- */
  .theme-ocean{
    --bg:linear-gradient(165deg,#052a40 0%,#0a5c7a 34%,#0f9ea3 68%,#86e3b4 100%);
    --blob1:rgba(134,239,196,.38); --blob2:rgba(255,226,140,.30); --blob3:rgba(120,200,255,.28);
    --ink:#ffffff; --sub:rgba(255,255,255,.78);
    --card:rgba(255,255,255,.13); --cardline:rgba(255,255,255,.38); --rowline:rgba(255,255,255,.28);
    --ok:#9bf6c4; --few:#ffd166; --full:rgba(255,255,255,.50); --accent:#ffffff; --chip:rgba(255,255,255,.18);
  }
  .theme-sunset{
    --bg:linear-gradient(165deg,#34195f 0%,#a24b8a 38%,#f0777f 70%,#ffbf8b 100%);
    --blob1:rgba(255,214,170,.40); --blob2:rgba(255,120,170,.34); --blob3:rgba(150,120,255,.30);
    --ink:#ffffff; --sub:rgba(255,255,255,.82);
    --card:rgba(255,255,255,.14); --cardline:rgba(255,255,255,.40); --rowline:rgba(255,255,255,.30);
    --ok:#c3fadc; --few:#ffe38e; --full:rgba(255,255,255,.52); --accent:#ffffff; --chip:rgba(255,255,255,.20);
  }
  .theme-milk{
    --bg:linear-gradient(165deg,#f7fbf9 0%,#e0f3ec 48%,#fdf1e0 100%);
    --blob1:rgba(110,205,170,.34); --blob2:rgba(255,196,120,.34); --blob3:rgba(130,190,235,.26);
    --ink:#1d3a33; --sub:#4f6b63;
    --card:rgba(255,255,255,.72); --cardline:rgba(47,111,98,.20); --rowline:rgba(47,111,98,.20);
    --ok:#1f9d74; --few:#d98a16; --full:#93a69d; --accent:#2f6f62; --chip:rgba(47,111,98,.10);
  }

  /* ---- 画面全体 ---- */
  #stage{position:relative; width:1080px; height:1920px; background:var(--bg); color:var(--ink); overflow:hidden}
  .blob{position:absolute; border-radius:50%; filter:blur(70px)}
  .b1{width:760px; height:760px; left:-220px; top:-120px; background:var(--blob1)}
  .b2{width:820px; height:820px; right:-300px; top:640px; background:var(--blob2)}
  .b3{width:700px; height:700px; left:-180px; bottom:-160px; background:var(--blob3)}
  .ring{position:absolute; border:2px solid var(--cardline); border-radius:50%; opacity:.5}
  .r1{width:520px; height:520px; right:-140px; top:210px}
  .r2{width:300px; height:300px; left:-90px; top:1320px}

  /* ---- 見出し ---- */
  header{position:absolute; left:0; right:0; top:232px; text-align:center}
  .eyebrow{font-size:30px; letter-spacing:.42em; font-weight:400; color:var(--sub); padding-left:.42em}
  .weekday{font-size:140px; line-height:1; font-weight:200; letter-spacing:.14em; padding-left:.14em; margin-top:14px; white-space:nowrap}
  .weekday span{display:inline-block}
  .dateline{display:inline-flex; align-items:center; gap:26px; margin-top:16px; padding:14px 44px; border-radius:999px; background:var(--chip); border:1.5px solid var(--cardline)}
  .dateline .md{font-size:62px; font-weight:300; letter-spacing:.06em}
  .dateline .bar{width:2px; height:46px; background:var(--cardline)}
  .dateline .jp{font-size:44px; font-weight:700; letter-spacing:.04em}
  .title{margin-top:22px; font-size:44px; font-weight:700; letter-spacing:.2em; padding-left:.2em}

  /* ---- 本文 ---- */
  main{position:absolute; left:0; right:0; top:668px; display:flex; justify-content:center; gap:36px; padding:0 56px}
  .card{background:var(--card); border:1.5px solid var(--cardline); border-radius:56px; padding:34px 38px 30px; box-shadow:0 30px 70px rgba(0,0,0,.14); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
  .card.one{width:640px}
  .card.two{width:468px}
  .card h3{display:flex; align-items:baseline; justify-content:center; gap:16px; font-size:46px; font-weight:900; letter-spacing:.12em; padding-bottom:16px; margin-bottom:6px; border-bottom:1.5px solid var(--rowline)}
  .card h3 small{font-size:23px; font-weight:400; letter-spacing:.3em; color:var(--sub)}
  ul{list-style:none}
  li{display:flex; align-items:center; gap:18px; height:86px}
  li .t{font-size:54px; font-weight:500; letter-spacing:.03em; min-width:158px; font-variant-numeric:tabular-nums}
  li .t i{font-style:normal; font-size:34px; color:var(--sub); margin-left:2px}
  li .dots{flex:1; height:0; border-top:3px dotted var(--rowline); transform:translateY(2px)}
  li .mark{width:64px; height:64px; display:flex; align-items:center; justify-content:center}
  li .mark svg{width:60px; height:60px; overflow:visible}
  li.ok .mark svg{color:var(--ok); filter:drop-shadow(0 0 10px rgba(155,246,196,.45))}
  li.few .mark svg{color:var(--few); filter:drop-shadow(0 0 10px rgba(255,209,102,.45))}
  li.full .mark svg{color:var(--full)}
  li.full .t{color:var(--full)}
  .theme-milk li.ok .mark svg, .theme-milk li.few .mark svg{filter:none}
  ul.cols2{columns:2; column-gap:30px}
  ul.cols2 li{break-inside:avoid}

  /* ---- 休診日 ---- */
  .closed{width:860px; text-align:center; padding:70px 40px 64px}
  .closed .icon{width:150px; height:150px; margin:0 auto 26px; border-radius:50%; background:var(--chip); border:1.5px solid var(--cardline); display:flex; align-items:center; justify-content:center}
  .closed .icon svg{width:84px; height:84px; color:var(--ink)}
  .closed .big{font-size:84px; font-weight:900; letter-spacing:.1em; padding-left:.1em}
  .closed .en{font-size:30px; letter-spacing:.42em; color:var(--sub); margin-top:14px; padding-left:.42em; font-weight:300}
  .closed .next{margin-top:46px; padding-top:34px; border-top:1.5px solid var(--rowline); font-size:38px; color:var(--sub); letter-spacing:.06em}
  .closed .next b{display:block; margin-top:10px; font-size:52px; color:var(--ink); letter-spacing:.05em}

  /* ---- 下部 ---- */
  footer{position:absolute; left:0; right:0; top:1452px; text-align:center}
  .legend{display:inline-flex; gap:40px; align-items:center; font-size:32px; font-weight:700; letter-spacing:.06em}
  .legend span{display:inline-flex; align-items:center; gap:12px}
  .legend svg{width:34px; height:34px; overflow:visible}
  .legend .lo svg{color:var(--ok)} .legend .lf svg{color:var(--few)} .legend .lx svg{color:var(--full)}
  .note{margin-top:20px; font-size:28px; color:var(--sub); letter-spacing:.05em}
  .cta{margin-top:18px; font-size:34px; font-weight:700; letter-spacing:.08em}
  .brand{margin-top:14px; font-size:28px; color:var(--sub); letter-spacing:.18em; padding-left:.18em}
</style>
</head>
<body>
<div id="stage" class="theme-milk">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="ring r1"></div><div class="ring r2"></div>
  <header>
    <div class="eyebrow en" id="eyebrow">TODAY'S RESERVATION</div>
    <div class="weekday en"><span id="weekday"></span></div>
    <div class="dateline"><span class="md en" id="md"></span><span class="bar"></span><span class="jp" id="jp"></span></div>
    <div class="title" id="title">今日の予約状況</div>
  </header>
  <main id="content"></main>
  <footer id="footer"></footer>
</div>

<script>
  // ---- 記号（◯ △ ×）は、文字ではなく図形で描く。フォントによる見え方の違いが出ず、どの環境でもきれいに出る ----
  const MARKS = {
    ok:   '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="30" r="22"/></svg>',
    few:  '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 8 L53 49 H7 Z"/></svg>',
    full: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10 L50 50 M50 10 L10 50"/></svg>'
  };
  const MOON = '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 36.5A19 19 0 1 1 23.5 16a15 15 0 0 0 20.5 20.5Z"/><path d="M42 9v8M38 13h8" /></svg>';
  const EN_DAYS = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];

  // 残り人数から、◯（空きあり）△（残りわずか）×（満席）を決める
  function statusFor(remaining, cap){
    if (remaining <= 0) return "full";
    if (remaining === 1 && cap >= 2) return "few";
    return "ok";
  }
  function rowHtml(t, st){
    const m = t.split(":");
    return '<li class="'+st+'"><span class="t en">'+m[0]+':'+m[1]+'<i>〜</i></span><span class="dots"></span><span class="mark">'+MARKS[st]+'</span></li>';
  }
  function cardHtml(label, en, times, statuses, single){
    const many = times.length > 9;
    return '<section class="card '+(single ? 'one' : 'two')+'"><h3>'+label+'<small class="en">'+en+'</small></h3><ul'+(many?' class="cols2"':'')+'>'
      + times.map(t=>rowHtml(t, statuses[t])).join("") + '</ul></section>';
  }

  /**
   * payload = { today:"2026-10-06", data:{bookings,menu,closures,openDays,capacity,slotCapacities}, config:{theme,clinic,handle,cta,note} }
   * 診療時間・休診日・受付人数・満席の判定は、予約システムと同じ common.js の関数をそのまま使う
   * （予約システム側の設定変更が、そのままストーリーにも反映される）。
   */
  window.renderStory = function(payload){
    const cfg = Object.assign({ theme:"milk", clinic:"こうむら接骨院", handle:"", cta:"ご予約はプロフィールのリンクから", note:"" }, payload.config||{});
    const today = payload.today, d = payload.data || {};
    document.getElementById("stage").className = "theme-" + cfg.theme;

    setCapacity(d.capacity); setSlotCapacities(d.slotCapacities);
    setExtraClosures(d.closures); setExtraOpenDays(d.openDays);
    const bookings = (d.bookings||[]).map(normalizeBooking);

    const dt = new Date(today + "T00:00:00");
    const wd = document.getElementById("weekday");
    wd.textContent = EN_DAYS[dt.getDay()];
    // WEDNESDAY など文字数の多い曜日が画面からはみ出さないよう、幅に収まるまで文字を小さくする
    const wdBox = wd.parentElement; wdBox.style.fontSize = "140px";
    for (let fs = 140; fs > 70 && wd.getBoundingClientRect().width > 940; fs -= 4) wdBox.style.fontSize = fs + "px";
    document.getElementById("md").textContent = String(dt.getMonth()+1).padStart(2,"0") + "." + String(dt.getDate()).padStart(2,"0");
    document.getElementById("jp").textContent = (dt.getMonth()+1) + "月" + dt.getDate() + "日（" + DOW[dt.getDay()] + "）";

    const slots = getSlotsForDate(today);
    const main = document.getElementById("content");
    const footer = document.getElementById("footer");
    const brand = '<div class="brand en">'+cfg.clinic+(cfg.handle ? ' ／ '+cfg.handle : '')+'</div>';

    if (slots.length === 0) {
      // ---- 休診日 ----
      document.getElementById("title").textContent = "本日のご案内";
      let next = "";
      for (let i = 1; i <= 30 && !next; i++) {
        const nd = new Date(dt); nd.setDate(nd.getDate() + i);
        const iso = fmtDate(nd), ns = getSlotsForDate(iso);
        if (ns.length > 0) next = (nd.getMonth()+1) + "月" + nd.getDate() + "日（" + DOW[nd.getDay()] + "）　" + ns[0] + "〜";
      }
      main.style.top = "720px";
      main.innerHTML = '<section class="card closed"><div class="icon">'+MOON+'</div><div class="big">本日は休診日です</div><div class="en">TODAY IS CLOSED</div>'
        + (next ? '<div class="next">次の診療日<b>'+next+'</b></div>' : '') + '</section>';
      footer.innerHTML = (cfg.note ? '<div class="note">'+cfg.note+'</div>' : '') + brand;
      footer.style.top = (main.getBoundingClientRect().bottom + 56) + "px";
      return;
    }

    // ---- 診療日：枠ごとの空き状況 ----
    const counts = getCountsForDate(today, bookings);
    const statuses = {};
    slots.forEach(t=>{
      const cap = capacityFor(today, t);
      statuses[t] = statusFor(cap - (counts[t]||0), cap);
    });
    const am = slots.filter(t => toMinutes(t) < 12*60), pm = slots.filter(t => toMinutes(t) >= 12*60);
    const groups = [];
    if (am.length) groups.push({ label:"午前", en:"MORNING", times:am });
    if (pm.length) groups.push({ label:"午後", en:"AFTERNOON", times:pm });
    main.innerHTML = groups.map(g => cardHtml(g.label, g.en, g.times, statuses, groups.length === 1)).join("");

    // 時間帯を絞った営業・一部休診の日は、「表示のない時間は受付していない」ことを添える
    const partial = (findClosure(today) && findClosure(today).ranges.length) || findOpenDay(today);
    const legend = '<div class="legend"><span class="lo">'+MARKS.ok+'空きあり</span><span class="lf">'+MARKS.few+'残りわずか</span><span class="lx">'+MARKS.full+'満席</span></div>';
    footer.innerHTML = legend
      + (partial ? '<div class="note">※表示のない時間帯は、受付していません</div>' : '')
      + (cfg.note ? '<div class="note">'+cfg.note+'</div>' : '')
      + '<div class="cta">'+cfg.cta+'</div>' + brand;
    footer.style.top = (main.getBoundingClientRect().bottom + 40) + "px";
  };
</script>
</body>
</html>
